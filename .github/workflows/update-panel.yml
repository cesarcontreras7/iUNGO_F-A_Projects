name: Actualizar panel de proyectos

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar index.html
        run: python3 scripts/generate_panel.py

      - name: Confirmar y subir cambios (si los hay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "El panel ya estaba al día — no hay cambios que subir."
          else
            git commit -m "Actualizar panel de proyectos automáticamente"
            git push
          fi
