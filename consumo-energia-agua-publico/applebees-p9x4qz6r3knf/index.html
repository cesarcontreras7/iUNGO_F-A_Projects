<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>bia | Reporte Mensual de Control de Consumos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root{
    --navy-deep:#0F1C50;
    --navy:#1D3565;
    --red:#EE2C37;
    --blue:#4888FD;
    --ink:#101a33;
    --paper:#F5F7FC;
    --card:#FFFFFF;
    --line:#E3E8F5;
    --muted:#6B7593;
    --good:#1FA971;
    --radius:14px;
    --shadow: 0 1px 2px rgba(16,26,51,.04), 0 8px 24px -8px rgba(16,26,51,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  ::selection{background:var(--blue);color:#fff;}

  /* ---------- top bar ---------- */
  .topbar{
    background:var(--navy-deep);
    color:#fff;
    padding:14px 24px;
    display:flex; align-items:center; gap:16px;
    position:sticky; top:0; z-index:40;
    box-shadow: var(--shadow);
  }
  .topbar img.logo{height:30px; display:block;}
  .topbar .titles{display:flex; flex-direction:column; line-height:1.15;}
  .topbar .titles .t1{font-family:'Space Grotesk'; font-weight:600; font-size:15px;}
  .topbar .titles .t2{font-size:12px; color:#9FB0E8;}
  .topbar .spacer{flex:1;}
  .topbar .status{font-size:12px; color:#B7C4EE; display:flex; align-items:center; gap:8px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good); box-shadow:0 0 0 3px rgba(31,169,113,.25);}
  .btn{
    border:none; cursor:pointer; font-family:'Inter'; font-weight:600; font-size:13px;
    padding:9px 16px; border-radius:10px; transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{box-shadow:0 6px 18px -6px rgba(238,44,55,.6);}
  .btn-ghost{background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18);}
  .btn-ghost:hover{background:rgba(255,255,255,.16);}
  .btn:disabled{opacity:.5; cursor:default;}

  /* ---------- layout ---------- */
  .wrap{max-width:1360px; margin:0 auto; padding:22px 24px 64px;}

  /* ---------- filters ---------- */
  .filters{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .field{display:flex; flex-direction:column; gap:6px; min-width:150px;}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
  .field select, .field input{
    border:1.5px solid var(--line); border-radius:9px; padding:8px 10px; font-size:13.5px;
    font-family:'Inter'; background:#fff; color:var(--ink); min-width:150px;
  }
  .field select:focus, .field input:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue);}
  .chain-toggle{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--line); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600;
    cursor:pointer; background:#fff; color:var(--muted); display:flex; align-items:center; gap:7px;
    transition:all .12s ease; user-select:none;
  }
  .chip img{height:14px; width:auto;}
  .chip.active{border-color:var(--navy); color:var(--navy); background:#EEF2FC;}
  .chip.active.red{border-color:var(--red); color:var(--red); background:#FDECED;}
  .field.grow{flex:1;}

  /* ---------- KPI cards ---------- */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .kpi{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .kpi::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,var(--blue));}
  .kpi .label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .kpi .value{font-family:'Space Grotesk'; font-size:26px; font-weight:700; margin-top:6px; color:var(--navy-deep);}
  .kpi .sub{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .kpi .sub.up{color:var(--red); font-weight:600;}
  .kpi .sub.down{color:var(--good); font-weight:600;}

  /* ---------- charts ---------- */
  .grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:16px;}
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow);
  }
  .panel h3{margin:0 0 2px; font-size:15px; font-weight:600; color:var(--navy-deep);}
  .panel .hint{font-size:12px; color:var(--muted); margin-bottom:10px;}
  .chart-box{position:relative; height:270px;}
  .chart-box.tall{height:340px;}
  .mini-kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding-top:6px;}
  .mini-kpi{background:#F7F9FE; border:1px solid var(--line); border-radius:10px; padding:14px 12px; text-align:center;}
  .mini-kpi-label{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
  .mini-kpi-value{font-family:'Space Grotesk'; font-size:20px; font-weight:700; color:var(--navy-deep);}
  @media (max-width:700px){ .mini-kpis{grid-template-columns:repeat(2,1fr);} }

  /* ---------- table ---------- */
  .table-panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .table-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 0;}
  .table-head h3{margin:0; font-size:15px; color:var(--navy-deep);}
  .table-scroll{overflow:auto; max-height:520px; margin-top:12px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    position:sticky; top:0; background:#F8FAFF; text-align:left; padding:10px 14px;
    font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    border-bottom:1.5px solid var(--line); cursor:pointer; white-space:nowrap;
  }
  thead th:hover{color:var(--navy);}
  .sort-arrow{font-size:9px; color:var(--blue); margin-left:3px;}
  tbody td{padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody tr:hover{background:#F7F9FE;}
  .subtotal-row td{background:#F0F3FC; font-weight:600; color:var(--navy-deep); border-bottom:1.5px solid var(--line); border-top:1px solid var(--line);}
  .subtotal-row:hover td{background:#E8EDFA;}
  .badge{display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:12px; padding:3px 9px; border-radius:999px;}
  .badge.ee{background:#FDECED; color:var(--red);}
  .badge.agua{background:#E8F0FE; color:var(--blue);}
  .tag-fija{font-size:10.5px; color:var(--muted); font-style:italic;}
  .num{text-align:right; font-variant-numeric:tabular-nums;}

  .empty, .loading{padding:60px 20px; text-align:center; color:var(--muted);}
  .loading .spinner{
    width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--red);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  footer{text-align:center; color:var(--muted); font-size:12px; padding:26px 0 10px;}

  @media (max-width:980px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }
  @media (max-width:600px){
    .kpis{grid-template-columns:1fr;}
    .topbar{flex-wrap:wrap;}
  }
</style>
</head>

<script>
// ---------------------------------------------------------------------------
// ESTADO
// ---------------------------------------------------------------------------
var RAW = null;           // { generatedAt, datasets: [...] }
var FILTERS = { chain: '__all__', utility: '__all__', monthFrom: null, monthTo: null, search: '' };
var CHARTS = {};
var COLORS = { navy:'#1D3565', navyDeep:'#0F1C50', red:'#EE2C37', blue:'#4888FD', good:'#1FA971' };
var ALL_MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var MONTH_INDEX = {};
ALL_MONTHS.forEach(function(m, i){ MONTH_INDEX[m] = i; });

function padNo(n){
  var num = parseInt(n, 10);
  if (isNaN(num)) return (n || '').toString();
  return num < 10 ? '0' + num : '' + num;
}
function fmtQ(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  return 'Q ' + n.toLocaleString('es-GT', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtNum(n, unit){
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString('es-GT', {maximumFractionDigits:1}) + (unit ? ' ' + unit : '');
}

// ---------------------------------------------------------------------------
// CARGA DE DATOS
// ---------------------------------------------------------------------------
function loadData(){
  document.getElementById('refreshBtn').disabled = true;
  fetch('./data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(onDataLoaded)
    .catch(onDataError);
}

function onDataError(err){
  document.getElementById('content').innerHTML =
    '<div class="empty">No se pudieron cargar los datos.<br><small>' + (err && err.message ? err.message : err) + '</small></div>';
  document.getElementById('refreshBtn').disabled = false;
}

function onDataLoaded(data){
  RAW = data;
  document.getElementById('refreshBtn').disabled = false;
  var d = new Date(data.generatedAt);
  document.getElementById('lastUpdated').textContent = 'Actualizado ' + d.toLocaleString('es-GT');
  var errors = (data.datasets||[]).filter(function(ds){ return ds.error; });
  renderErrorBanner(errors);
  populateMonthSelectors();
  populateRestaurantOptions();
  syncChainChipsVisibility();
  render();
}

// Oculta los chips de cadena (Panda Express / Applebee's) que no tengan
// datos en el JSON cargado. Así el mismo index.html sirve tanto para la
// vista gerencial (ambas cadenas) como para las vistas segmentadas
// (solo Panda o solo Applebee's) sin tocar código — el filtrado real ya
// viene hecho desde el data.json que publica Apps Script.
function syncChainChipsVisibility(){
  var chainsPresentes = {};
  (RAW.datasets||[]).forEach(function(ds){ chainsPresentes[ds.chain] = true; });
  var toggle = document.getElementById('chainToggle');
  if (!toggle) return;
  toggle.querySelectorAll('.chip').forEach(function(chip){
    var c = chip.getAttribute('data-chain');
    if (c === '__all__') return; // el chip "Todas" siempre se muestra
    chip.style.display = chainsPresentes[c] ? '' : 'none';
  });
  var visibles = Object.keys(chainsPresentes);
  if (visibles.length === 1) {
    var unico = toggle.querySelector('.chip[data-chain="' + visibles[0] + '"]');
    if (unico) {
      toggle.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
      unico.classList.add('active');
      FILTERS.chain = visibles[0];
    }
    // con una sola cadena, oculta también el chip "Todas" — no aporta nada
    var todos = toggle.querySelector('.chip[data-chain="__all__"]');
    if (todos) todos.style.display = 'none';
  }
}

function renderErrorBanner(errors){
  var existing = document.getElementById('errorBanner');
  if (existing) existing.remove();
  if (!errors.length) return;
  var div = document.createElement('div');
  div.id = 'errorBanner';
  div.style.cssText = 'background:#FDECED;border:1px solid #f3b7bb;color:#8a1620;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;';
  div.innerHTML = '<strong>⚠ No se pudieron leer ' + errors.length + ' fuente(s):</strong><br>' +
    errors.map(function(e){ return '· ' + e.chain + ' — ' + e.utility + ': ' + e.error; }).join('<br>');
  document.querySelector('.wrap').insertBefore(div, document.getElementById('filters'));
}

function monthsPresent(){
  var set = {};
  (RAW.datasets||[]).forEach(function(ds){ (ds.months||[]).forEach(function(m){ set[m]=true; }); });
  return ALL_MONTHS.filter(function(m){ return set[m]; });
}

function populateMonthSelectors(){
  var months = monthsPresent();
  var from = document.getElementById('monthFrom');
  var to = document.getElementById('monthTo');
  from.innerHTML = ''; to.innerHTML = '';
  months.forEach(function(m){
    from.appendChild(new Option(m, m));
    to.appendChild(new Option(m, m));
  });
  if (months.length){
    from.value = months[0];
    to.value = months[months.length-1];
    FILTERS.monthFrom = months[0];
    FILTERS.monthTo = months[months.length-1];
  }
}

function restaurantKey(chain, name){ return chain + '|' + name; }

function populateRestaurantOptions(){
  var sel = document.getElementById('searchBox');
  var current = FILTERS.search;
  var seen = {};
  var options = [];
  (RAW.datasets||[]).forEach(function(ds){
    if (FILTERS.chain !== '__all__' && ds.chain !== FILTERS.chain) return;
    if (FILTERS.utility !== '__all__' && ds.utility !== FILTERS.utility) return;
    (ds.restaurants||[]).forEach(function(rest){
      var key = restaurantKey(ds.chain, rest.name);
      if (seen[key]) return;
      seen[key] = true;
      var noNum = parseInt(rest.no, 10);
      var noLabel = isNaN(noNum) ? (rest.no || '') : (noNum < 10 ? '0' + noNum : '' + noNum);
      options.push({
        key:key,
        sortNo: isNaN(noNum) ? 9999 : noNum,
        chain: ds.chain,
        label: (noLabel ? noLabel + ' — ' : '') + rest.name + ' (' + ds.chain + ')',
      });
    });
  });
  options.sort(function(a,b){
    if (a.chain !== b.chain) return a.chain.localeCompare(b.chain, 'es');
    return a.sortNo - b.sortNo;
  });

  sel.innerHTML = '<option value="">Todos los restaurantes</option>';
  options.forEach(function(o){ sel.appendChild(new Option(o.label, o.key)); });

  if (current && seen[current]) {
    sel.value = current;
  } else {
    FILTERS.search = '';
    sel.value = '';
  }
}

// ---------------------------------------------------------------------------
// FILTRADO
// ---------------------------------------------------------------------------
function monthInRange(m){
  var months = monthsPresent();
  var i = months.indexOf(m), from = months.indexOf(FILTERS.monthFrom), to = months.indexOf(FILTERS.monthTo);
  if (i<0 || from<0 || to<0) return true;
  return i>=from && i<=to;
}

function getFilteredRows(opts){
  opts = opts || {};
  var rows = [];
  (RAW.datasets||[]).forEach(function(ds){
    if (FILTERS.chain !== '__all__' && ds.chain !== FILTERS.chain) return;
    if (FILTERS.utility !== '__all__' && ds.utility !== FILTERS.utility) return;
    (ds.restaurants||[]).forEach(function(rest){
      if (!opts.ignoreSearch && FILTERS.search && restaurantKey(ds.chain, rest.name) !== FILTERS.search) return;
      Object.keys(rest.months||{}).forEach(function(month){
        if (!monthInRange(month)) return;
        var mm = rest.months[month];
        rows.push({
          chain: ds.chain, utility: ds.utility, unit: ds.unit,
          restaurant: rest.name, restNo: rest.no, month: month,
          consumo: mm.consumo, costo: mm.costo, cargo: mm.cargo, tarifaFija: mm.tarifaFija,
        });
      });
    });
  });
  return rows;
}

// ---------------------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------------------
function render(){
  var rows = getFilteredRows();
  renderKPIs(rows);
  renderCharts(rows);
  renderTable(rows);
}

function renderKPIs(rows){
  var totalCargo = 0, totalConsumoEE = 0, totalConsumoAgua = 0, restSet = {};
  rows.forEach(function(r){
    totalCargo += (r.cargo||0);
    if (r.utility === 'Energía Eléctrica') totalConsumoEE += (r.consumo||0);
    if (r.utility === 'Agua Potable') totalConsumoAgua += (r.consumo||0);
    restSet[r.chain + '|' + r.restaurant] = true;
  });
  var html = ''
    + kpiCard('Cargo Total P&L', fmtQ(totalCargo), 'Suma del periodo filtrado', COLORS.red)
    + kpiCard('Consumo Energía', fmtNum(totalConsumoEE,'kWh'), 'Energía Eléctrica', COLORS.blue)
    + kpiCard('Consumo Agua', fmtNum(totalConsumoAgua,'m³'), 'Agua Potable', COLORS.navy)
    + kpiCard('Restaurantes', Object.keys(restSet).length, 'En el filtro actual', COLORS.good);
  document.getElementById('kpiRow') ? (document.getElementById('kpiRow').innerHTML = html) : null;
}

function kpiCard(label, value, sub, color){
  return '<div class="kpi" style="--accent:'+color+'">' +
    '<div class="label">'+label+'</div>' +
    '<div class="value">'+value+'</div>' +
    '<div class="sub">'+sub+'</div></div>';
}

function renderCharts(rows){
  // -- trend: cargo por mes --
  var months = monthsPresent().filter(monthInRange);
  var byMonth = {};
  months.forEach(function(m){ byMonth[m] = {ee:0, agua:0}; });
  rows.forEach(function(r){
    if (!byMonth[r.month]) return;
    if (r.utility === 'Energía Eléctrica') byMonth[r.month].ee += (r.cargo||0);
    if (r.utility === 'Agua Potable') byMonth[r.month].agua += (r.cargo||0);
  });

  var trendDatasets = [];
  if (FILTERS.utility === '__all__' || FILTERS.utility === 'Energía Eléctrica') {
    trendDatasets.push({ label:'Energía Eléctrica', data: months.map(function(m){return byMonth[m].ee;}), borderColor:COLORS.red, backgroundColor:'rgba(238,44,55,.08)', tension:.35, fill:true, pointRadius:3 });
  }
  if (FILTERS.utility === '__all__' || FILTERS.utility === 'Agua Potable') {
    trendDatasets.push({ label:'Agua Potable', data: months.map(function(m){return byMonth[m].agua;}), borderColor:COLORS.blue, backgroundColor:'rgba(72,136,253,.08)', tension:.35, fill:true, pointRadius:3 });
  }
  drawChart('trendChart', 'line', {
    labels: months,
    datasets: trendDatasets
  }, { plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}},
       scales:{ y:{ ticks:{ callback:function(v){return 'Q'+v.toLocaleString('es-GT');} } } } });

  var chainTitleEl = document.getElementById('chainChartTitle');
  var chainHintEl = document.getElementById('chainChartHint');

  if (FILTERS.search) {
    // -- vista "administrador de restaurante": tarjetas KPI simples en vez de una gráfica de ranking --
    var selChain = FILTERS.search.split('|')[0];
    var selName = FILTERS.search.split('|').slice(1).join('|');

    // usamos las filas SIN el filtro de restaurante para poder comparar contra los pares
    var peerRows = getFilteredRows({ ignoreSearch: true }).filter(function(r){ return r.chain === selChain; });
    var totals = {};
    peerRows.forEach(function(r){ totals[r.restaurant] = (totals[r.restaurant]||0) + (r.cargo||0); });
    var ranking = Object.keys(totals).map(function(name){ return { name:name, total:totals[name] }; })
      .sort(function(a,b){ return b.total - a.total; });

    var avg = ranking.length ? ranking.reduce(function(s,r){return s+r.total;},0) / ranking.length : 0;
    var mine = totals[selName] || 0;
    var myRank = ranking.findIndex(function(r){ return r.name === selName; }) + 1;
    var diffPct = avg > 0 ? Math.round(((mine - avg) / avg) * 100) : null;
    var aboveAvg = diffPct !== null && diffPct > 0;

    if (chainTitleEl) chainTitleEl.textContent = selName + ' vs. su cadena';
    if (chainHintEl) chainHintEl.textContent = 'Cargo P&L del periodo — ' + selChain;

    if (CHARTS['chainChart']) { CHARTS['chainChart'].destroy(); delete CHARTS['chainChart']; }
    var chainChartBox = document.getElementById('chainChartBox');
    if (chainChartBox) {
      chainChartBox.innerHTML =
        '<div class="mini-kpis">' +
          '<div class="mini-kpi"><div class="mini-kpi-label">Cargo de este restaurante</div><div class="mini-kpi-value">' + fmtQ(mine) + '</div></div>' +
          '<div class="mini-kpi"><div class="mini-kpi-label">Promedio de la cadena</div><div class="mini-kpi-value" style="color:var(--navy-deep);">' + fmtQ(avg) + '</div></div>' +
          '<div class="mini-kpi"><div class="mini-kpi-label">Diferencia vs. promedio</div><div class="mini-kpi-value" style="color:' + (diffPct===null?'var(--muted)':(aboveAvg?'var(--red)':'var(--good)')) + '">' +
            (diffPct===null ? '—' : (aboveAvg ? '▲ +' + diffPct + '%' : '▼ ' + diffPct + '%')) + '</div></div>' +
          '<div class="mini-kpi"><div class="mini-kpi-label">Posición en su cadena</div><div class="mini-kpi-value" style="color:var(--navy-deep);">' + (myRank||'—') + ' <span style="font-size:15px; color:var(--muted); font-weight:600;">de ' + ranking.length + '</span></div></div>' +
        '</div>' +
        '<div class="hint" style="margin-top:14px; text-align:center;">' +
          (diffPct===null ? 'No hay suficientes datos de otros restaurantes para comparar.' :
            (aboveAvg
              ? 'Este restaurante gastó ' + Math.abs(diffPct) + '% más que el promedio de sus ' + (ranking.length-1) + ' pares en la cadena — vale la pena revisar qué está pasando.'
              : 'Este restaurante gastó ' + Math.abs(diffPct) + '% menos que el promedio de sus ' + (ranking.length-1) + ' pares en la cadena — buen desempeño en el periodo.')) +
        '</div>';
    }
  } else {
    // -- vista corporativa: comparación entre cadenas --
    var chainChartBoxRestore = document.getElementById('chainChartBox');
    if (chainChartBoxRestore && !document.getElementById('chainChart')) {
      chainChartBoxRestore.innerHTML = '<canvas id="chainChart"></canvas>';
    }
    var chains = [];
    var byChainUtility = {};
    rows.forEach(function(r){
      if (chains.indexOf(r.chain) === -1) chains.push(r.chain);
      byChainUtility[r.chain] = byChainUtility[r.chain] || { ee:0, agua:0 };
      if (r.utility === 'Energía Eléctrica') byChainUtility[r.chain].ee += (r.cargo||0);
      if (r.utility === 'Agua Potable') byChainUtility[r.chain].agua += (r.cargo||0);
    });
    chains.sort();

    if (chainTitleEl) chainTitleEl.textContent = 'Energía vs. Agua por cadena';
    if (chainHintEl) chainHintEl.textContent = 'Cargo P&L acumulado en el periodo';
    var chainDatasets = [];
    if (FILTERS.utility === '__all__' || FILTERS.utility === 'Energía Eléctrica') {
      chainDatasets.push({ label:'Energía Eléctrica', data: chains.map(function(c){return byChainUtility[c].ee;}), backgroundColor: COLORS.red, borderRadius:6, maxBarThickness:46 });
    }
    if (FILTERS.utility === '__all__' || FILTERS.utility === 'Agua Potable') {
      chainDatasets.push({ label:'Agua Potable', data: chains.map(function(c){return byChainUtility[c].agua;}), backgroundColor: COLORS.blue, borderRadius:6, maxBarThickness:46 });
    }
    drawChart('chainChart', 'bar', {
      labels: chains,
      datasets: chainDatasets
    }, { plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}},
         scales:{ y:{ ticks:{ callback:function(v){return 'Q'+v.toLocaleString('es-GT');} } } } });
  }

  // -- panel derecho de la 2a fila: Top 10 (vista general) o evolución mensual (un restaurante) --
  var topPanelTitleEl = document.getElementById('topPanelTitle');
  var topHint = document.getElementById('topHint');
  var topBox = document.getElementById('topBox');

  if (FILTERS.search) {
    var selName2 = FILTERS.search.split('|').slice(1).join('|');
    if (topPanelTitleEl) topPanelTitleEl.textContent = 'Evolución mensual — ' + selName2;
    if (topHint) topHint.textContent = 'Consumo (barras) y Cargo P&L (línea) por mes';
    if (topBox && !document.getElementById('topChart')) topBox.innerHTML = '<canvas id="topChart"></canvas>';

    var byMonthRest = {};
    months.forEach(function(m){ byMonthRest[m] = { consumo:0, cargo:0 }; });
    rows.forEach(function(r){
      if (!byMonthRest[r.month]) return;
      byMonthRest[r.month].consumo += (typeof r.consumo === 'number' ? r.consumo : 0);
      byMonthRest[r.month].cargo += (r.cargo || 0);
    });
    drawChart('topChart', 'bar', {
      labels: months,
      datasets: [
        { label:'Consumo (' + (rows[0]?rows[0].unit:'') + ')', data: months.map(function(m){return byMonthRest[m].consumo;}), backgroundColor: COLORS.blue, borderRadius:5, yAxisID:'y' },
        { type:'line', label:'Cargo P&L (Q)', data: months.map(function(m){return byMonthRest[m].cargo;}), borderColor: COLORS.red, backgroundColor:'rgba(238,44,55,.08)', tension:.3, pointRadius:3, yAxisID:'y1' },
      ]
    }, {
      indexAxis:'x',
      plugins:{ legend:{ position:'bottom', labels:{boxWidth:10,font:{size:11}} } },
      scales:{
        y:{ position:'left', title:{display:true,text:'Consumo'} },
        y1:{ position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'Cargo P&L (Q)'} },
      },
    });
  } else {
    if (topPanelTitleEl) topPanelTitleEl.textContent = 'Top 10 restaurantes';
    if (topBox && !document.getElementById('topChart')) topBox.innerHTML = '<canvas id="topChart"></canvas>';

    var byRest = {};
    rows.forEach(function(r){
      var k = r.restaurant + '|' + r.chain;
      byRest[k] = byRest[k] || { name:r.restaurant, chain:r.chain, no:r.restNo, total:0 };
      byRest[k].total += (r.cargo||0);
    });
    var top = Object.values(byRest).sort(function(a,b){return b.total-a.total;}).slice(0,10);
    var topChains = Array.from(new Set(top.map(function(t){return t.chain;})));
    if (topHint) topHint.textContent = 'Por cargo P&L acumulado en el periodo — ' + topChains.join(' · ');

    drawChart('topChart', 'bar', {
      labels: top.map(function(t, i){ return (i+1) + '. ' + t.name; }),
      datasets: [{ label:'Cargo P&L', data: top.map(function(t){return t.total;}), backgroundColor: COLORS.navy, borderRadius:6, maxBarThickness:22 }]
    }, { indexAxis:'y', plugins:{legend:{display:false}}, scales:{ x:{ ticks:{ callback:function(v){return 'Q'+v.toLocaleString('es-GT');} } } } });
  }

  // -- costo por unidad: tendencia mensual, una línea por restaurante (solo con un único servicio) --
  var unitCostHint = document.getElementById('unitCostHint');
  var unitCostBox = document.getElementById('unitCostBox');
  var unitCostTitleEl = document.getElementById('unitCostTitle');

  if (FILTERS.utility === '__all__') {
    if (CHARTS['unitCostChart']) { CHARTS['unitCostChart'].destroy(); delete CHARTS['unitCostChart']; }
    if (unitCostTitleEl) unitCostTitleEl.textContent = 'Costo mensual por restaurante';
    if (unitCostBox) unitCostBox.innerHTML = '<div class="empty" style="padding:40px 10px;">Elige "Energía" o "Agua" en el filtro de Servicio para ver la tendencia de costo por unidad (kWh y m³ no son comparables).</div>';
  } else {
    if (unitCostBox && !document.getElementById('unitCostChart')) {
      unitCostBox.innerHTML = '<canvas id="unitCostChart"></canvas>';
    }
    var unit = rows[0] ? rows[0].unit : 'unidad';
    if (unitCostTitleEl) unitCostTitleEl.textContent = 'Costo mensual ' + unit + ' por restaurante';
    if (unitCostHint) unitCostHint.textContent = 'Q por ' + unit + ' — promedio ponderado mensual';

    var palette = [COLORS.navy, COLORS.red, COLORS.blue, COLORS.good, '#B5179E', '#F77F00'];
    var byRestName = {};
    rows.forEach(function(r){ byRestName[r.restaurant] = (byRestName[r.restaurant]||0) + (typeof r.consumo === 'number' ? r.consumo : 0); });
    var restNames = Object.keys(byRestName).sort(function(a,b){ return byRestName[b]-byRestName[a]; });

    var unitCostDatasets;
    if (restNames.length <= 1) {
      var byMonthUnit = {};
      months.forEach(function(m){ byMonthUnit[m] = { cargo:0, consumo:0 }; });
      rows.forEach(function(r){
        if (!byMonthUnit[r.month] || typeof r.consumo !== 'number' || !r.consumo) return;
        byMonthUnit[r.month].cargo += (r.cargo||0);
        byMonthUnit[r.month].consumo += r.consumo;
      });
      unitCostDatasets = [{
        label: restNames[0] || 'Costo por unidad',
        data: months.map(function(m){ var d=byMonthUnit[m]; return d.consumo>0 ? d.cargo/d.consumo : null; }),
        borderColor: COLORS.navy, backgroundColor:'rgba(29,53,101,.08)', tension:.35, fill:true, pointRadius:3, spanGaps:true,
      }];
    } else {
      var topRestNames = restNames.slice(0, 6);
      unitCostDatasets = topRestNames.map(function(name, idx){
        var byMonthR = {};
        months.forEach(function(m){ byMonthR[m] = { cargo:0, consumo:0 }; });
        rows.forEach(function(r){
          if (r.restaurant !== name || !byMonthR[r.month] || typeof r.consumo !== 'number' || !r.consumo) return;
          byMonthR[r.month].cargo += (r.cargo||0);
          byMonthR[r.month].consumo += r.consumo;
        });
        return {
          label: name,
          data: months.map(function(m){ var d=byMonthR[m]; return d.consumo>0 ? d.cargo/d.consumo : null; }),
          borderColor: palette[idx % palette.length], tension:.3, pointRadius:2, fill:false, spanGaps:true,
        };
      });
      if (unitCostHint) unitCostHint.textContent += ' — top 6 por consumo';
    }

    drawChart('unitCostChart', 'line', {
      labels: months,
      datasets: unitCostDatasets
    }, { plugins:{legend:{ display: restNames.length > 1, position:'bottom', labels:{boxWidth:10,font:{size:10}} }},
         scales:{ y:{ ticks:{ callback:function(v){return 'Q'+v.toLocaleString('es-GT',{maximumFractionDigits:2});} } } } });
  }
}

function drawChart(canvasId, type, data, extraOptions){
  var ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (typeof Chart === 'undefined'){
    ctx.parentElement.innerHTML = '<div class="empty">No se pudo cargar la librería de gráficas (Chart.js). Revisa tu conexión e intenta actualizar.</div>';
    return;
  }
  if (CHARTS[canvasId]) CHARTS[canvasId].destroy();
  CHARTS[canvasId] = new Chart(ctx, {
    type: type,
    data: data,
    options: Object.assign({ responsive:true, maintainAspectRatio:false }, extraOptions||{})
  });
}

var SORT = { col:'restNo', dir:1 };

function renderTable(rows){

  if (!content.querySelector('.table-panel')){
    content.innerHTML =
      '<div class="table-panel" style="margin-bottom:24px;">' +
        '<div class="table-head"><h3>Detalle de consumos</h3><span class="hint" id="rowCount"></span></div>' +
        '<div class="table-scroll"><table id="dataTable"><thead><tr>' +
          '<th data-col="restNo">No. <span class="sort-arrow"></span></th>' +
          '<th data-col="chain">Cadena <span class="sort-arrow"></span></th><th data-col="utility">Servicio <span class="sort-arrow"></span></th><th data-col="restaurant">Restaurante <span class="sort-arrow"></span></th>' +
          '<th data-col="month">Mes <span class="sort-arrow"></span></th><th data-col="consumo" class="num">Consumo <span class="sort-arrow"></span></th>' +
          '<th data-col="costo" class="num">Costo/unidad <span class="sort-arrow"></span></th><th data-col="cargo" class="num">Cargo P&amp;L <span class="sort-arrow"></span></th>' +
        '</tr></thead><tbody></tbody></table></div>' +
      '</div>' +
      '<h3 style="margin:0 0 12px; color:var(--navy-deep);">Resumen</h3>' +
      '<div class="kpis" id="kpiRow"></div>' +
      '<div class="grid-2">' +
        '<div class="panel"><h3>Cargo P&amp;L mensual</h3><div class="hint">Energía vs. Agua — periodo filtrado</div><div class="chart-box tall"><canvas id="trendChart"></canvas></div></div>' +
        '<div class="panel"><h3 id="chainChartTitle">Energía vs. Agua por cadena</h3><div class="hint" id="chainChartHint">Cargo P&amp;L acumulado en el periodo</div><div class="chart-box tall" id="chainChartBox"><canvas id="chainChart"></canvas></div></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><h3 id="topPanelTitle">Top 10 restaurantes</h3><div class="hint" id="topHint">Por cargo P&amp;L acumulado en el periodo</div><div class="chart-box" id="topBox"><canvas id="topChart"></canvas></div></div>' +
        '<div class="panel"><h3 id="unitCostTitle">Costo por unidad — tendencia</h3><div class="hint" id="unitCostHint">Promedio ponderado mensual</div><div class="chart-box" id="unitCostBox"><canvas id="unitCostChart"></canvas></div></div>' +
      '</div>';
    content.querySelectorAll('thead th').forEach(function(th){
      th.addEventListener('click', function(){
        var col = th.getAttribute('data-col');
        SORT.dir = (SORT.col === col) ? -SORT.dir : -1;
        SORT.col = col;
        renderTableBody(getFilteredRows());
      });
    });
    // re-render KPIs/charts now that containers exist
    renderKPIs(rows);
    renderCharts(rows);
  }
  renderTableBody(rows);
}

function renderTableBody(rows){
  var distinctGroups = {};
  rows.forEach(function(r){ distinctGroups[r.chain + '|' + r.restaurant + '|' + r.utility] = true; });
  var groupedByRestaurant = (SORT.col === 'restNo' || SORT.col === 'restaurant') && Object.keys(distinctGroups).length > 1;

  var sorted = rows.slice().sort(function(a,b){
    var av = a[SORT.col], bv = b[SORT.col];
    var primary;
    if (SORT.col === 'restNo') {
      var an = parseInt(av, 10), bn = parseInt(bv, 10);
      an = isNaN(an) ? 9999 : an; bn = isNaN(bn) ? 9999 : bn;
      primary = an - bn;
    } else if (typeof av === 'string' || typeof bv === 'string') {
      primary = (av||'').toString().localeCompare((bv||'').toString());
    } else {
      primary = (av||0) - (bv||0);
    }
    primary = SORT.dir * primary;
    if (primary !== 0) return primary;

    // desempate: si estamos agrupando por restaurante, ordena los meses
    // siempre de Enero a Junio (cronológico), sin importar la dirección del clic
    if (groupedByRestaurant) {
      if (a.utility !== b.utility) return a.utility.localeCompare(b.utility, 'es');
      return (MONTH_INDEX[a.month]||0) - (MONTH_INDEX[b.month]||0);
    }
    return 0;
  });

  document.querySelectorAll('#dataTable thead th').forEach(function(th){
    var arrow = th.querySelector('.sort-arrow');
    if (!arrow) return;
    arrow.textContent = (th.getAttribute('data-col') === SORT.col) ? (SORT.dir === 1 ? '▲' : '▼') : '';
  });

  document.getElementById('rowCount').textContent = sorted.length + ' filas';
  var tbody = document.querySelector('#dataTable tbody');

  var html = '';
  var groupKey = null, groupConsumo = 0, groupCargo = 0, groupChain = '', groupRest = '', groupUtility = '', groupUnit = '';

  function flushSubtotal(){
    if (groupKey === null) return;
    html += '<tr class="subtotal-row">' +
      '<td colspan="5">Subtotal — ' + groupRest + ' (' + groupUtility + ')</td>' +
      '<td class="num">' + fmtNum(groupConsumo, groupUnit) + '</td>' +
      '<td class="num">—</td>' +
      '<td class="num">' + fmtQ(groupCargo) + '</td>' +
      '</tr>';
  }

  sorted.forEach(function(r){
    var key = r.chain + '|' + r.restaurant + '|' + r.utility;
    if (groupedByRestaurant && key !== groupKey) {
      flushSubtotal();
      groupKey = key; groupConsumo = 0; groupCargo = 0;
      groupChain = r.chain; groupRest = r.restaurant; groupUtility = r.utility; groupUnit = r.unit;
    }
    if (groupedByRestaurant) {
      groupConsumo += (typeof r.consumo === 'number' ? r.consumo : 0);
      groupCargo += (r.cargo || 0);
    }
    var badgeClass = r.utility === 'Energía Eléctrica' ? 'ee' : 'agua';
    var badgeIcon = r.utility === 'Energía Eléctrica' ? '⚡' : '💧';
    html += '<tr>' +
      '<td>'+padNo(r.restNo)+'</td>' +
      '<td>'+r.chain+'</td>' +
      '<td><span class="badge '+badgeClass+'">'+badgeIcon+' '+r.utility+'</span></td>' +
      '<td>'+r.restaurant+'</td>' +
      '<td>'+r.month+'</td>' +
      '<td class="num">'+ (r.tarifaFija ? '<span class="tag-fija">Tarifa fija</span>' : fmtNum(r.consumo, r.unit)) +'</td>' +
      '<td class="num">'+ (r.costo===null ? '—' : fmtQ(r.costo)) +'</td>' +
      '<td class="num">'+fmtQ(r.cargo)+'</td>' +
      '</tr>';
  });
  if (groupedByRestaurant) flushSubtotal();

  var singleGroupKeys = Object.keys(distinctGroups);
  if (singleGroupKeys.length === 1 && sorted.length > 1) {
    var only = singleGroupKeys[0].split('|');
    var oRest = only[1], oUtility = only[2];
    var n = sorted.length;
    var sumConsumo = 0, countConsumo = 0, sumCosto = 0, countCosto = 0, sumCargo = 0;
    sorted.forEach(function(r){
      if (typeof r.consumo === 'number') { sumConsumo += r.consumo; countConsumo++; }
      if (typeof r.costo === 'number') { sumCosto += r.costo; countCosto++; }
      sumCargo += (r.cargo || 0);
    });
    var avgConsumo = countConsumo ? sumConsumo / countConsumo : null;
    var avgCosto = countCosto ? sumCosto / countCosto : null;
    var avgCargo = sumCargo / n;
    var unit = sorted[0].unit;
    html += '<tr class="subtotal-row" style="border-top:2px solid var(--navy);">' +
      '<td colspan="5">Promedio — ' + oRest + ' (' + oUtility + ')</td>' +
      '<td class="num">' + (avgConsumo===null ? '—' : fmtNum(avgConsumo, unit)) + '</td>' +
      '<td class="num">' + (avgCosto===null ? '—' : fmtQ(avgCosto)) + '</td>' +
      '<td class="num">' + fmtQ(avgCargo) + '</td>' +
      '</tr>';
  }

  tbody.innerHTML = html || '<tr><td colspan="8" class="empty">Sin resultados para este filtro</td></tr>';
}

// ---------------------------------------------------------------------------
// EXPORTAR A EXCEL
// ---------------------------------------------------------------------------
function csvEscape_(v){
  if (v === null || v === undefined) return '';
  var s = v.toString();
  if (/[",\n;]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

// Exporta a CSV (se abre directo en Excel) los datos que se están viendo
// con los filtros actuales. Esta versión pública no genera el .xlsx con
// el formato de marca — ese export completo sigue disponible en el
// dashboard interno de iUNGO.
function exportExcel(){
  var btn = document.getElementById('exportBtn');
  var originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳ Generando...';

  try {
    var rows = getFilteredRows();
    var header = ['No.','Cadena','Servicio','Restaurante','Mes','Consumo','Unidad','Costo/unidad','Cargo P&L (Q)'];
    var lines = [header.map(csvEscape_).join(';')];
    rows.forEach(function(r){
      lines.push([
        r.restNo || '', r.chain, r.utility, r.restaurant, r.month,
        r.tarifaFija ? 'Tarifa fija' : (r.consumo === null || r.consumo === undefined ? '' : r.consumo),
        r.unit,
        r.costo === null || r.costo === undefined ? '' : r.costo,
        r.cargo === null || r.cargo === undefined ? 0 : r.cargo,
      ].map(csvEscape_).join(';'));
    });
    var csv = '\uFEFF' + lines.join('\r\n'); // BOM para que Excel abra bien los acentos
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    var stamp = new Date().toISOString().slice(0,10);
    a.download = 'bia_consumos_' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  } catch (err) {
    alert('No se pudo generar el archivo: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}

// ---------------------------------------------------------------------------
// EVENTOS
// ---------------------------------------------------------------------------
document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('exportBtn').addEventListener('click', exportExcel);
document.getElementById('searchBox').addEventListener('change', function(e){ FILTERS.search = e.target.value; render(); });
document.getElementById('monthFrom').addEventListener('change', function(e){ FILTERS.monthFrom = e.target.value; render(); });
document.getElementById('monthTo').addEventListener('change', function(e){ FILTERS.monthTo = e.target.value; render(); });

document.getElementById('chainToggle').addEventListener('click', function(e){
  var chip = e.target.closest('.chip'); if (!chip) return;
  this.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
  chip.classList.add('active');
  FILTERS.chain = chip.getAttribute('data-chain');
  populateRestaurantOptions();
  render();
});
document.getElementById('utilityToggle').addEventListener('click', function(e){
  var chip = e.target.closest('.chip'); if (!chip) return;
  this.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active','red'); });
  chip.classList.add('active');
  if (chip.getAttribute('data-utility') === 'Energía Eléctrica') chip.classList.add('red');
  FILTERS.utility = chip.getAttribute('data-utility');
  populateRestaurantOptions();
  render();
});

loadData();
// auto-refresh cada 5 minutos — vuelve a leer data.json (el snapshot que
// publica Apps Script periódicamente desde los Sheets reales)
setInterval(loadData, 5*60*1000);
</script>
