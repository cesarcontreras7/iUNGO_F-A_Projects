<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Herramientas — bia / iUNGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E2246;
    --navy-dark:#12142E;
    --navy-soft:#E9EAF1;
    --red:#DA293A;
    --red-soft:#FBE7E9;
    --slate:#4B5A85;
    --gold:#C9A227;
    --bg:#F5F5F8;
    --card:#FFFFFF;
    --text:#22242E;
    --text-muted:#6B6D7C;
    --border:#E3E2E9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Source Sans 3',Arial,sans-serif;font-size:14px;line-height:1.4;}
  h1,h2,h3,.brand-font{font-family:'Montserrat',Arial,sans-serif;}

  header.topbar{
    background:var(--navy);color:#fff;padding:26px 32px;
    display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--red);
  }
  header.topbar img.bia-logo{height:42px;width:auto;background:#fff;border-radius:6px;padding:5px 8px;}
  header.topbar .title h1{margin:0;font-size:22px;font-weight:700;}
  header.topbar .title p{margin:4px 0 0;font-size:13px;color:#B9BCD6;}

  main{max-width:1100px;margin:0 auto;padding:36px 24px 60px;}

  .section{margin-bottom:36px;}
  .section h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);
    font-weight:700;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:16px;}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;
    display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;
    transition:.15s;position:relative;overflow:hidden;
  }
  .card:hover{border-color:var(--navy);box-shadow:0 6px 18px rgba(30,34,70,.10);transform:translateY(-2px);}
  .card .tag{
    align-self:flex-start;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    padding:3px 9px;border-radius:20px;background:var(--navy-soft);color:var(--navy);
  }
  .card.accent-red .tag{background:var(--red-soft);color:var(--red);}
  .card h3{margin:0;font-size:16px;font-weight:700;color:var(--text);}
  .card p{margin:0;font-size:13px;color:var(--text-muted);flex-grow:1;}
  .card .cta{
    font-size:13px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px;margin-top:4px;
  }
  .card:hover .cta{color:var(--red);}
  .card .cta svg{transition:.15s;}
  .card:hover .cta svg{transform:translateX(3px);}

  footer{text-align:center;color:var(--text-muted);font-size:11px;padding:20px 24px 30px;}

  .empty-state{color:var(--text-muted);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:10px;}
</style>
</head>

   - category: agrupa las tarjetas bajo un mismo título de sección
   - url: ruta relativa a la carpeta del proyecto (con "/" al final)
   - accent: "navy" (por defecto) o "red", solo cambia el color del tag
   ============================================================ */
const PROJECTS = [
  {
    category: "Dashboards analíticos",
    title: "Análisis Atención a Tickets BiaQSR",
    description: "Panel interactivo completo — filtros, comparación de meses y detalle por especialista y estado.",
    url: "./analisis-tickets-biaqsr/",
    tag: "Dashboard",
    accent: "navy"
  },
  {
    category: "Dashboards analíticos",
    title: "Análisis Gerencial — Tickets BiaQSR",
    description: "Versión resumida para compartir fuera de iUNGO, sin datos de estado ni especialista.",
    url: "./analisis-tickets-biaqsr-gerencial/",
    tag: "Dashboard",
    accent: "red"
  },
  {
    category: "Procesos y guías operativas",
    title: "Proceso de Compras Directas",
    description: "Infografía interactiva — guía operativa para restaurantes.",
    url: "./compras-directas-bia-qsr/",
    tag: "Guía",
    accent: "navy"
  },
  {
    category: "Procesos y guías operativas",
    title: "Gestión Reintegros Beneficio Médico",
    description: "Flujo de proceso y matriz RACI.",
    url: "./reintegros-beneficio-medico/",
    tag: "Guía",
    accent: "navy"
  }
];

function arrowIcon(){
  return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function render(){
  const main = document.getElementById('main');
  if(!PROJECTS.length){
    main.innerHTML = '<div class="empty-state">Aún no hay proyectos cargados.</div>';
    return;
  }
  const categories = [...new Set(PROJECTS.map(p=>p.category))];
  main.innerHTML = categories.map(cat=>{
    const items = PROJECTS.filter(p=>p.category===cat);
    return `
      <div class="section">
        <h2>${cat}</h2>
        <div class="grid">
          ${items.map(p=>`
            <a class="card ${p.accent==='red' ? 'accent-red':''}" href="${p.url}">
              <span class="tag">${p.tag||'Proyecto'}</span>
              <h3>${p.title}</h3>
              <p>${p.description||''}</p>
              <span class="cta">Abrir ${arrowIcon()}</span>
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}
render();
</script>
</body>
</html>
